[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-hybrid-rag"
version = "2.0.0"
description = "Production-grade Multimodal Hybrid RAG System with FAISS, BM25, CLIP, RRF Fusion, Cross-Encoder Reranking, and Telemetry"
readme = "README.md"
authors = [
  { name = "Developer", email = "developer@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=2.2.2",
    "transformers>=4.34.0",
    "torch>=2.0.0",
    "pillow>=10.0.0",
    "groq>=0.4.0",
    "tavily-python>=0.3.0",
    "structlog>=23.1.0",
    "python-multipart>=0.0.6",
    "pypdf>=3.16.0",
    "python-docx>=0.8.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "black>=23.9.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]
ignore = []

[tool.black]
line-length = 100
target-version = ['py310']
